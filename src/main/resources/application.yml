# FlowForge runtime configuration. Every environment-specific value is an ${ENV_VAR:default} placeholder so the
# same artefact runs locally, in Docker Compose and in production without rebuilding.
spring:
  application:
    name: ${APP_NAME:flowforge}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD:flowforge}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: flowforge-hikari

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate           # schema is owned by Flyway; Hibernate only verifies the mapping
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        query.in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: set SPRING_DATA_REDIS_PASSWORD when the instance requires AUTH
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.records: 100
        isolation.level: read_committed
    listener:
      ack-mode: record
      observation-enabled: true    # continue traces from record headers
    template:
      observation-enabled: true    # inject trace context into record headers

  threads:
    virtual:
      enabled: false

  task:
    scheduling:
      pool:
        size: 3
      thread-name-prefix: sched-

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE:*}      # restrict to health,info,prometheus outside development
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:always}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        workflow.execution.duration: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    annotations:
      enabled: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] [tenant=%X{tenantId:-} user=%X{userId:-}] "
  include-application-name: false
  level:
    com.flowforge: ${LOG_LEVEL_APP:INFO}
    org.apache.kafka: WARN
    org.hibernate.SQL: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

flowforge:
  tenant:
    header: X-Tenant-ID

  security:
    jwt:
      # Must be >= 32 bytes. Override in every non-local environment.
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}
      issuer: flowforge
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
      cleanup-cron: "0 0 3 * * *"

  idempotency:
    header: X-Idempotency-Key
    response-ttl: 24h
    lock-ttl: 30s
    max-key-length: 128

  kafka:
    topics:
      execution-events: flowforge.workflow-execution.events
    partitions: ${KAFKA_PARTITIONS:3}
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
    listener-concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    consumer-groups:
      notification: flowforge-notification
    retry:
      max-attempts: 5
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 30000

  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    initial-delay-ms: 5000
    batch-size: 50
    max-retries: 10
    initial-backoff: 2s
    send-timeout: 10s
    topics:
      WorkflowExecution: ${flowforge.kafka.topics.execution-events}

  execution:
    executor:
      core-pool-size: ${EXECUTOR_CORE_POOL_SIZE:4}
      max-pool-size: ${EXECUTOR_MAX_POOL_SIZE:16}
      queue-capacity: 500
    webhook:
      connect-timeout: 5s
      read-timeout: 15s
      max-response-bytes: 65536
    recovery:
      enabled: true
      interval-ms: 60000
      stalled-after: 2m
      batch-size: 20

  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    tenant-id: ${BOOTSTRAP_TENANT_ID:}
    tenant-name: ${BOOTSTRAP_TENANT_NAME:default}
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@flowforge.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
