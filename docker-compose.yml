# Full FlowForge stack: backend + PostgreSQL, Redis, Kafka (KRaft), Jaeger (OTLP traces), Prometheus, Grafana.
# Host ports are parameterised so the stack coexists with other projects (override via env or a .env file).
#   docker compose up --build -d
#   docker compose ps
#   docker compose logs -f backend
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowforge/backend:local
    container_name: flowforge-backend
    ports: ["${FLOWFORGE_BACKEND_PORT:-18080}:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flowforge
      DB_USERNAME: flowforge
      DB_PASSWORD: flowforge
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      JWT_SECRET: local-dev-only-secret-local-dev-only-secret-0123456789
      BOOTSTRAP_ENABLED: "true"
      BOOTSTRAP_TENANT_ID: 11111111-1111-1111-1111-111111111111
      BOOTSTRAP_TENANT_NAME: default
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_EMAIL: admin@flowforge.local
      BOOTSTRAP_ADMIN_PASSWORD: Admin123!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
    ports: ["${FLOWFORGE_POSTGRES_PORT:-15432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${FLOWFORGE_REDIS_PORT:-16379}:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.8.0
    container_name: flowforge-kafka
    ports: ["${FLOWFORGE_KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      # PLAINTEXT is reachable from other containers (kafka:29092); EXTERNAL from the host (localhost:9092).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: flowforge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports: ["${FLOWFORGE_PGADMIN_PORT:-5050}:80"]
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./ops/pgadmin/servers.json:/pgadmin4/servers.json:ro   # pre-registers the FlowForge database
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: flowforge-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports: ["${FLOWFORGE_REDIS_COMMANDER_PORT:-8081}:8081"]
    depends_on:
      redis:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: flowforge-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: flowforge-prometheus
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["${FLOWFORGE_PROMETHEUS_PORT:-9090}:9090"]
    depends_on:
      backend:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    container_name: flowforge-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["${FLOWFORGE_GRAFANA_PORT:-3001}:3000"]
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
